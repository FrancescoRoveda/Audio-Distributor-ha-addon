name: Publish Audio Distributor

on:
  push:
    branches:
      - main
    paths:
      - "audio-distributor/**"
      - ".github/workflows/publish-audio-distributor.yaml"
  workflow_dispatch: {}

concurrency: publish-audio-distributor

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on image
        uses: home-assistant/builder@2025.11.0
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/audio-distributor \
            --image "{arch}-audio-distributor" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --addon
