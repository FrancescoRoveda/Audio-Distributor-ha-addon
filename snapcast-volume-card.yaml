type: vertical-stack
cards:
  # Overall Group Volume Control
  - type: custom:mushroom-media-player-card
    entity: media_player.cucina_sala_snapcast_group
    name: 🎵 Snapcast - All Speakers
    icon: mdi:speaker-multiple
    use_media_info: true
    use_media_artwork: false
    show_volume_level: true
    volume_controls:
      - volume_mute
      - volume_set
    collapsible_controls: false
    fill_container: false
    card_mod:
      style: |
        ha-card {
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          border-radius: 16px;
          box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
  
  # Individual Speaker Controls
  - type: horizontal-stack
    cards:
      # Cucina Speaker
      - type: custom:mushroom-media-player-card
        entity: media_player.cucina_snapcast_client
        name: 🍳 Cucina
        icon: mdi:speaker
        use_media_info: false
        use_media_artwork: false
        show_volume_level: true
        volume_controls:
          - volume_mute
          - volume_set
        collapsible_controls: false
        card_mod:
          style: |
            ha-card {
              background: rgba(255, 255, 255, 0.05);
              border-radius: 12px;
              border: 1px solid rgba(255, 255, 255, 0.1);
            }
      
      # Sala Speaker
      - type: custom:mushroom-media-player-card
        entity: media_player.sala_snapcast_client
        name: 🛋️ Sala
        icon: mdi:speaker
        use_media_info: false
        use_media_artwork: false
        show_volume_level: true
        volume_controls:
          - volume_mute
          - volume_set
        collapsible_controls: false
        card_mod:
          style: |
            ha-card {
              background: rgba(255, 255, 255, 0.05);
              border-radius: 12px;
              border: 1px solid rgba(255, 255, 255, 0.1);
            }
